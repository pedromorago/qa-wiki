name: Deploy wiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo run en vuelo; si llegan varios push seguidos (p. ej. guardados del
# CMS), solo queda encolado el último — los intermedios se descartan.
concurrency:
  group: pages
  cancel-in-progress: false

# Un único job: se ahorra el arranque de runners extra y, con la caché de
# node_modules, el commit→publicado queda en ~30s (más el índice de búsqueda).
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necesario para lastUpdated

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Caché de node_modules completo: si el lockfile no cambió, npm ci se
      # salta entero (la única dependencia es VitePress; instala poco pero
      # tarda — este paso es el grueso de la mejora de latencia).
      - uses: actions/cache@v4
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - run: npm run build

      # Índice de búsqueda semántica (IA en el navegador). Deps aisladas y
      # modelo cacheado para que el paso sea barato.
      - name: Install search-index deps
        run: npm ci
        working-directory: scripts/search
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: scripts/search/.model-cache
          key: search-model-v1
      - name: Build semantic search index
        run: node build-index.mjs ../../docs ../../docs/.vitepress/dist/search-index.json
        working-directory: scripts/search

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@v4
